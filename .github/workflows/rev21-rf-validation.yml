name: T-TWR Rev2.1 RF Validation Fix

on:
  push:
    branches:
      - rev21-hardware-port
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rev21-rf-validation
  cancel-in-progress: false

jobs:
  patch-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply existing Rev2.1 compatibility passes
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "static void applyTwrRev21HardwareProfile()" src/main.cpp; then
            python tools/rev21_port.py
          fi
          python tools/repair_rev21_afsk_macros.py
          python tools/rev21_runtime_fixes.py
          python tools/rev21_full_compat.py
          python tools/rev21_radio_safety.py
          python tools/rev21_sleep_compat.py
          python tools/rev21_display_i2c_compat.py
          python tools/rev21_deep_compat.py

      - name: Apply physical RF validation fixes
        shell: bash
        run: |
          set -euo pipefail
          python tools/rev21_hw_validation_fixes.py
          python tools/rev21_modem_late_extern_fix.py

      - name: Verify all Rev2.1 invariants
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_rev21_port.py
          python tools/verify_rev21_deep_compat.py
          python tools/verify_rev21_hw_validation.py
          git diff --check

      - name: Verify RF-validation patch is idempotent
        shell: bash
        run: |
          set -euo pipefail
          FILES="src/main.cpp src/config.cpp src/webservice.cpp lib/LibAPRS_ESP32S3/AFSK.cpp lib/LibAPRS_ESP32S3/AFSK.h lib/LibAPRS_ESP32S3/modem.cpp"
          BEFORE="$(sha256sum $FILES | sha256sum | awk '{print $1}')"
          python tools/rev21_hw_validation_fixes.py
          python tools/rev21_modem_late_extern_fix.py
          AFTER="$(sha256sum $FILES | sha256sum | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          echo "PASS Rev2.1 RF-validation patch is idempotent"

      - name: Detect source patch
        id: patch_state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main.cpp src/config.cpp src/webservice.cpp lib/LibAPRS_ESP32S3/AFSK.cpp lib/LibAPRS_ESP32S3/AFSK.h lib/LibAPRS_ESP32S3/modem.cpp; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio esptool

      - name: PlatformIO build
        run: pio run -e esp32s3-twrplus

      - name: Package RF-validation firmware
        shell: bash
        run: |
          set -euo pipefail
          ENV_DIR=.pio/build/esp32s3-twrplus
          mkdir -p dist
          cp "$ENV_DIR/firmware.bin" dist/TWR_APRS_Rev21_UPDATE.bin
          cp "$ENV_DIR/bootloader.bin" dist/bootloader.bin
          cp "$ENV_DIR/partitions.bin" dist/partitions.bin
          BOOT_APP="$(find "$HOME/.platformio" -type f -name boot_app0.bin | head -n 1 || true)"
          test -n "$BOOT_APP"
          cp "$BOOT_APP" dist/boot_app0.bin
          python -m esptool --chip esp32s3 merge-bin \
            -o dist/TWR_APRS_Rev21_FULL_INSTALL.bin \
            0x0000 dist/bootloader.bin \
            0x8000 dist/partitions.bin \
            0xe000 dist/boot_app0.bin \
            0x10000 dist/TWR_APRS_Rev21_UPDATE.bin
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Build workflow commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Hardware: LILYGO T-TWR Plus Rev2.1"
            echo "Validation status: STATIC/CI ONLY - PHYSICAL RF VALIDATION PENDING"
            echo
            echo "Changes:"
            echo "- Disable GPIO42 NeoPixel/RMT during RF validation"
            echo "- Stop ADC DMA enqueue while AFSK TX is active"
            echo "- Bound and flush RX FIFO across TX-to-RX transition"
            echo "- Defer TX-stop GPIO/ADC work from timer ISR to task context"
            echo "- Add event-only PTT41/MUX17 TX START/STOP diagnostics"
            echo "- Remove per-second tracker counter serial spam"
          } > dist/BUILD_INFO.txt
          rm -f dist/TWR_APRS_Rev21_NIGHTLY_2026-09-05.zip
          zip -j dist/TWR_APRS_Rev21_NIGHTLY_2026-09-05.zip \
            dist/TWR_APRS_Rev21_UPDATE.bin \
            dist/TWR_APRS_Rev21_FULL_INSTALL.bin \
            dist/bootloader.bin \
            dist/partitions.bin \
            dist/boot_app0.bin \
            dist/SHA256SUMS.txt \
            dist/BUILD_INFO.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWR-APRS-Rev21-RF-Validation-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Refresh Nightly GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/rev21-hardware-port' && steps.patch_state.outputs.dirty == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nightly-rev21-2026-09-05"
          RELEASE_ID="383216847"
          SOURCE_SHA="$(git log -1 --format=%H -- src/main.cpp src/config.cpp src/webservice.cpp lib/LibAPRS_ESP32S3/AFSK.cpp lib/LibAPRS_ESP32S3/AFSK.h lib/LibAPRS_ESP32S3/modem.cpp)"

          cat > dist/RELEASE_NOTES.md <<EOF
          # LILYGO T-TWR Plus Rev2.1 — Nightly RF Validation Build

          **Firmware source checkpoint:** \`${SOURCE_SHA}\`  
          **CI workflow run:** \`${GITHUB_RUN_ID}\`  
          **Target hardware:** LILYGO T-TWR Plus Rev2.1 / ESP32-S3 / SA868S / SH1106 128x64

          > **Nightly status:** Static/source/build verification is green. Physical on-device RF validation is still required before this can be called hardware-validated stable.

          ## RF validation fixes in this refresh
          - Disabled GPIO42 NeoPixel/RMT during RF validation to remove the observed ESP32-S3 RMT allocation failure from the APRS test path.
          - ADC DMA samples are no longer enqueued while AFSK TX owns the audio path.
          - RX FIFO is bounded and flushed during the TX-to-RX transition.
          - TX-stop GPIO/ADC work is deferred out of the timer ISR into FreeRTOS task context.
          - Added event-only TX diagnostics for PTT41 / MUX17 / DAC18 START and STOP state.
          - Removed per-second tracker counter serial spam.
          - Normalized all AFSK transition flags and modem extern declarations to volatile-safe definitions.

          ## Rev2.1 validation gates
          - **74/74** Rev2.1 source/hardware invariants: PASS
          - **64/64** deep compatibility invariants: PASS
          - **30/30** RF hardware-validation invariants: PASS
          - PlatformIO compile/link for \`esp32s3-twrplus\`: PASS
          - Firmware image packaging: PASS
          - RF-validation patch idempotence: PASS

          ## Hardware behavior retained
          - SA868 UART: TX GPIO39 / RX GPIO48
          - PTT: GPIO41 active LOW; idle HIGH
          - PD: GPIO40 active HIGH
          - SQL: GPIO2 active LOW
          - APRS RX ADC: GPIO1
          - APRS TX audio: GPIO18
          - Audio routing: GPIO17
          - Rev2.0 GPIO38 RF-power selector remains disabled on Rev2.1
          - RF HIGH/LOW remains SA868 DMOSETGROUP HIGH=0 / LOW=1
          - SH1106 OLED uses shared I2C SDA8/SCL9 at 400 kHz

          ## Assets
          - \`TWR_APRS_Rev21_UPDATE.bin\` — normal firmware update
          - \`TWR_APRS_Rev21_FULL_INSTALL.bin\` — clean full install image
          - \`TWR_APRS_Rev21_NIGHTLY_2026-09-05.zip\` — complete build bundle
          - \`SHA256SUMS.txt\` — binary checksums
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$SOURCE_SHA"
          git push --force origin "refs/tags/$TAG"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="Nightly Build — LILYGO T-TWR Plus Rev2.1 — RF Validation — 2026-09-05" \
            -f target_commitish="$SOURCE_SHA" \
            -F body=@dist/RELEASE_NOTES.md >/dev/null

          gh release upload "$TAG" \
            dist/TWR_APRS_Rev21_UPDATE.bin \
            dist/TWR_APRS_Rev21_FULL_INSTALL.bin \
            dist/TWR_APRS_Rev21_NIGHTLY_2026-09-05.zip \
            dist/SHA256SUMS.txt \
            --clobber

          echo "PASS Nightly release refreshed at source $SOURCE_SHA"

      - name: Commit verified source patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/rev21-hardware-port' && steps.patch_state.outputs.dirty == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp src/config.cpp src/webservice.cpp lib/LibAPRS_ESP32S3/AFSK.cpp lib/LibAPRS_ESP32S3/AFSK.h lib/LibAPRS_ESP32S3/modem.cpp
          git commit -m "Apply Rev2.1 physical RF validation fixes"
          git push origin HEAD:rev21-hardware-port
