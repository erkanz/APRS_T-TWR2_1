name: T-TWR Rev2.1 Firmware

on:
  push:
    branches:
      - rev21-hardware-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply T-TWR Rev2.1 hardware port
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "static void applyTwrRev21HardwareProfile()" src/main.cpp; then
            echo "Rev2.1 hardware port already present in committed source."
          else
            python tools/rev21_port.py
          fi

      - name: Repair AFSK macro continuation
        run: python tools/repair_rev21_afsk_macros.py

      - name: Apply Rev2.1 runtime stability fixes
        run: python tools/rev21_runtime_fixes.py

      - name: Apply Rev2.1 full hardware compatibility pass
        run: python tools/rev21_full_compat.py

      - name: Apply Rev2.1 radio safety normalization
        run: python tools/rev21_radio_safety.py

      - name: Apply ESP32-S3 sleep compatibility fix
        run: python tools/rev21_sleep_compat.py

      - name: Apply Rev2.1 OLED shared-I2C compatibility fix
        run: python tools/rev21_display_i2c_compat.py

      - name: Apply Rev2.1 deep compatibility pass
        run: python tools/rev21_deep_compat.py

      - name: Verify Rev2.1 source invariants
        run: python tools/verify_rev21_port.py

      - name: Verify Rev2.1 deep compatibility invariants
        run: python tools/verify_rev21_deep_compat.py

      - name: Verify patch pass is idempotent
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          BEFORE="$(git diff -- src/main.cpp src/webservice.cpp platformio.ini | sha256sum | awk '{print $1}')"
          python tools/rev21_deep_compat.py
          AFTER="$(git diff -- src/main.cpp src/webservice.cpp platformio.ini | sha256sum | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          echo "PASS Rev2.1 deep patch is idempotent"

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio esptool

      - name: PlatformIO build
        run: pio run -e esp32s3-twrplus

      - name: Package firmware images
        shell: bash
        run: |
          set -euo pipefail
          ENV_DIR=.pio/build/esp32s3-twrplus
          mkdir -p dist

          cp "$ENV_DIR/firmware.bin" dist/TWR_APRS_Rev21_UPDATE.bin
          cp "$ENV_DIR/bootloader.bin" dist/bootloader.bin
          cp "$ENV_DIR/partitions.bin" dist/partitions.bin

          BOOT_APP="$(find "$HOME/.platformio" -type f -name boot_app0.bin | head -n 1 || true)"
          if [ -z "$BOOT_APP" ]; then
            echo "boot_app0.bin not found" >&2
            exit 1
          fi
          cp "$BOOT_APP" dist/boot_app0.bin

          python -m esptool --chip esp32s3 merge-bin \
            -o dist/TWR_APRS_Rev21_FULL_INSTALL.bin \
            0x0000 dist/bootloader.bin \
            0x8000 dist/partitions.bin \
            0xe000 dist/boot_app0.bin \
            0x10000 dist/TWR_APRS_Rev21_UPDATE.bin

          cat > dist/FLASH_UPDATE_KEEP_SETTINGS.bat <<'EOF'
          @echo off
          setlocal
          set PORT=%~1
          if "%PORT%"=="" set /p PORT=Enter COM port (example COM27): 
          python -m esptool --chip esp32s3 --port %PORT% --baud 921600 write_flash -z 0x10000 TWR_APRS_Rev21_UPDATE.bin 0x410000 TWR_APRS_Rev21_UPDATE.bin
          if errorlevel 1 exit /b %errorlevel%
          echo.
          echo Rev2.1 firmware update complete in both OTA slots. Wi-Fi/callsign/settings were not erased.
          endlocal
          EOF
          sed -i 's/^          //' dist/FLASH_UPDATE_KEEP_SETTINGS.bat

          cat > dist/FLASH_FULL_CLEAN_INSTALL.bat <<'EOF'
          @echo off
          setlocal
          set PORT=%~1
          if "%PORT%"=="" set /p PORT=Enter COM port (example COM27): 
          python -m esptool --chip esp32s3 --port %PORT% erase_flash
          if errorlevel 1 exit /b %errorlevel%
          python -m esptool --chip esp32s3 --port %PORT% --baud 921600 write_flash -z 0x0000 TWR_APRS_Rev21_FULL_INSTALL.bin
          if errorlevel 1 exit /b %errorlevel%
          echo.
          echo Full clean install complete. Device settings must be configured again.
          endlocal
          EOF
          sed -i 's/^          //' dist/FLASH_FULL_CLEAN_INSTALL.bat

          cat > dist/FLASH_INSTRUCTIONS.txt <<'EOF'
          LILYGO T-TWR Plus Rev2.1 - FULL COMPATIBILITY BUILD
          ===================================================

          RECOMMENDED SERIAL UPDATE - PRESERVES SETTINGS
          ------------------------------------------------------
          The firmware has A/B OTA partitions. Web OTA may make either app0 or
          app1 the currently selected boot slot, so a serial update writes the
          same verified application image to BOTH OTA slots. NVS, OTA metadata,
          LittleFS and user settings are not erased.

          The PlatformIO Arduino builder intentionally uses a DIO ROM-bootstrap
          image even when the board is configured for QIO flash; the second-stage
          bootloader enables the configured Quad-I/O mode.

            File:    TWR_APRS_Rev21_UPDATE.bin
            app0:    0x10000
            app1:    0x410000
            Do NOT run erase_flash.

            python -m esptool --chip esp32s3 --port COMxx --baud 921600 write_flash -z 0x10000 TWR_APRS_Rev21_UPDATE.bin 0x410000 TWR_APRS_Rev21_UPDATE.bin

          Windows helper:
            FLASH_UPDATE_KEEP_SETTINGS.bat COM27

          CLEAN/FULL INSTALL - ERASES SETTINGS
          ------------------------------------------------------
            File:   TWR_APRS_Rev21_FULL_INSTALL.bin
            Offset: 0x0000

            python -m esptool --chip esp32s3 --port COMxx erase_flash
            python -m esptool --chip esp32s3 --port COMxx --baud 921600 write_flash -z 0x0000 TWR_APRS_Rev21_FULL_INSTALL.bin

          Windows helper:
            FLASH_FULL_CLEAN_INSTALL.bat COM27
          EOF
          sed -i 's/^          //' dist/FLASH_INSTRUCTIONS.txt

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Source commit: $GITHUB_SHA"
            echo "Environment: esp32s3-twrplus"
            echo "Hardware: LILYGO T-TWR Plus Rev2.1"
            echo "Board profile: official LilyGo-T-TWR-Plus"
            echo "Display controller: SH1106 128x64"
            echo "Configured flash: QIO 80MHz / 16MB"
            echo "PSRAM topology: OPI (qio_opi memory profile)"
            echo "ROM bootstrap header: DIO by PlatformIO Arduino design; second stage enables QIO"
            echo "SERIAL UPDATE image offsets: app0 0x10000 + app1 0x410000, no erase, settings preserved"
            echo "FULL_INSTALL image offset: 0x0000 after erase"
            echo
            ls -lh dist/*.bin
          } > dist/BUILD_INFO.txt

          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          cat dist/BUILD_INFO.txt
          cat dist/SHA256SUMS.txt

      - name: Verify packaged binary and partition invariants
        run: python tools/verify_rev21_binary.py

      - name: Show ESP image metadata
        shell: bash
        run: |
          python -m esptool --chip esp32s3 image-info dist/bootloader.bin
          python -m esptool --chip esp32s3 image-info dist/TWR_APRS_Rev21_UPDATE.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWR-APRS-Rev21-FULL-COMPAT-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified Rev2.1 source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp src/webservice.cpp include/main.h include/config.h lib/LibAPRS_ESP32S3/AFSK.cpp lib/LibAPRS_ESP32S3/AFSK.h platformio.ini boards/LilyGo-T-TWR-Plus.json
          if git diff --cached --quiet; then
            echo "PASS no generated source changes; committed source is reproducible."
          else
            git commit -m "Apply verified T-TWR Rev2.1 deep compatibility fixes"
            git push origin HEAD:rev21-hardware-port
          fi
