name: T-TWR Rev2.1 Firmware

on:
  push:
    branches:
      - rev21-hardware-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply T-TWR Rev2.1 hardware port
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "static void applyTwrRev21HardwareProfile()" src/main.cpp; then
            echo "Rev2.1 hardware port already present in committed source."
          else
            python tools/rev21_port.py
          fi

      - name: Repair AFSK macro continuation
        run: python tools/repair_rev21_afsk_macros.py

      - name: Apply Rev2.1 runtime stability fixes
        run: python tools/rev21_runtime_fixes.py

      - name: Apply Rev2.1 full hardware compatibility pass
        run: python tools/rev21_full_compat.py

      - name: Apply Rev2.1 radio safety normalization
        run: python tools/rev21_radio_safety.py

      - name: Verify Rev2.1 source invariants
        run: python tools/verify_rev21_port.py

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio esptool

      - name: PlatformIO build
        run: pio run -e esp32s3-twrplus

      - name: Package firmware images
        shell: bash
        run: |
          set -euo pipefail
          ENV_DIR=.pio/build/esp32s3-twrplus
          mkdir -p dist

          cp "$ENV_DIR/firmware.bin" dist/TWR_APRS_Rev21_UPDATE.bin
          cp "$ENV_DIR/bootloader.bin" dist/bootloader.bin
          cp "$ENV_DIR/partitions.bin" dist/partitions.bin

          BOOT_APP="$(find "$HOME/.platformio" -type f -name boot_app0.bin | head -n 1 || true)"
          if [ -z "$BOOT_APP" ]; then
            echo "boot_app0.bin not found" >&2
            exit 1
          fi
          cp "$BOOT_APP" dist/boot_app0.bin

          python -m esptool --chip esp32s3 merge-bin \
            -o dist/TWR_APRS_Rev21_FULL_INSTALL.bin \
            0x0000 dist/bootloader.bin \
            0x8000 dist/partitions.bin \
            0xe000 dist/boot_app0.bin \
            0x10000 dist/TWR_APRS_Rev21_UPDATE.bin

          cat > dist/FLASH_PROFILE_UPDATE_KEEP_SETTINGS.bat <<'EOF'
          @echo off
          setlocal
          set PORT=%~1
          if "%PORT%"=="" set /p PORT=Enter COM port (example COM27): 
          python -m esptool --chip esp32s3 --port %PORT% --baud 921600 write_flash -z 0x0000 bootloader.bin 0x10000 TWR_APRS_Rev21_UPDATE.bin
          if errorlevel 1 exit /b %errorlevel%
          echo.
          echo Rev2.1 QIO/OPI profile update complete. Wi-Fi/callsign/settings were not erased.
          endlocal
          EOF
          sed -i 's/^          //' dist/FLASH_PROFILE_UPDATE_KEEP_SETTINGS.bat

          cat > dist/FLASH_APP_UPDATE_KEEP_SETTINGS.bat <<'EOF'
          @echo off
          setlocal
          set PORT=%~1
          if "%PORT%"=="" set /p PORT=Enter COM port (example COM27): 
          python -m esptool --chip esp32s3 --port %PORT% --baud 921600 write_flash -z 0x10000 TWR_APRS_Rev21_UPDATE.bin
          if errorlevel 1 exit /b %errorlevel%
          echo.
          echo Application update complete. Wi-Fi/callsign/settings were not erased.
          endlocal
          EOF
          sed -i 's/^          //' dist/FLASH_APP_UPDATE_KEEP_SETTINGS.bat

          cat > dist/FLASH_FULL_CLEAN_INSTALL.bat <<'EOF'
          @echo off
          setlocal
          set PORT=%~1
          if "%PORT%"=="" set /p PORT=Enter COM port (example COM27): 
          python -m esptool --chip esp32s3 --port %PORT% erase_flash
          if errorlevel 1 exit /b %errorlevel%
          python -m esptool --chip esp32s3 --port %PORT% --baud 921600 write_flash -z 0x0000 TWR_APRS_Rev21_FULL_INSTALL.bin
          if errorlevel 1 exit /b %errorlevel%
          echo.
          echo Full clean install complete. Device settings must be configured again.
          endlocal
          EOF
          sed -i 's/^          //' dist/FLASH_FULL_CLEAN_INSTALL.bat

          cat > dist/FLASH_INSTRUCTIONS.txt <<'EOF'
          LILYGO T-TWR Plus Rev2.1 - FULL COMPATIBILITY BUILD
          ===================================================

          FIRST UPDATE FROM THE EARLIER DIO/GENERIC-BOARD BUILDS
          ------------------------------------------------------
          To adopt the official LilyGo-T-TWR-Plus QIO flash / OPI PSRAM profile
          while preserving Wi-Fi, callsign and LittleFS/NVS configuration, write
          ONLY the new bootloader and application. Do NOT erase flash and do NOT
          rewrite the partition table:

            python -m esptool --chip esp32s3 --port COMxx --baud 921600 write_flash -z 0x0000 bootloader.bin 0x10000 TWR_APRS_Rev21_UPDATE.bin

          Windows helper:
            FLASH_PROFILE_UPDATE_KEEP_SETTINGS.bat COM27

          NORMAL FUTURE APP UPDATE - PRESERVES SETTINGS
          ------------------------------------------------------
            File:   TWR_APRS_Rev21_UPDATE.bin
            Offset: 0x10000
            Do NOT run erase_flash.

            python -m esptool --chip esp32s3 --port COMxx --baud 921600 write_flash -z 0x10000 TWR_APRS_Rev21_UPDATE.bin

          Windows helper:
            FLASH_APP_UPDATE_KEEP_SETTINGS.bat COM27

          CLEAN/FULL INSTALL - ERASES SETTINGS
          ------------------------------------------------------
            File:   TWR_APRS_Rev21_FULL_INSTALL.bin
            Offset: 0x0000

            python -m esptool --chip esp32s3 --port COMxx erase_flash
            python -m esptool --chip esp32s3 --port COMxx --baud 921600 write_flash -z 0x0000 TWR_APRS_Rev21_FULL_INSTALL.bin

          Windows helper:
            FLASH_FULL_CLEAN_INSTALL.bat COM27
          EOF
          sed -i 's/^          //' dist/FLASH_INSTRUCTIONS.txt

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Source commit: $GITHUB_SHA"
            echo "Environment: esp32s3-twrplus"
            echo "Hardware: LILYGO T-TWR Plus Rev2.1"
            echo "Board profile: LilyGo-T-TWR-Plus (QIO flash / OPI PSRAM)"
            echo "Profile migration preserving settings: bootloader@0x0000 + UPDATE@0x10000, no erase"
            echo "Future UPDATE image offset: 0x10000, no erase"
            echo "FULL_INSTALL image offset: 0x0000 after erase"
            echo
            ls -lh dist/*.bin
          } > dist/BUILD_INFO.txt

          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          cat dist/BUILD_INFO.txt
          cat dist/SHA256SUMS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWR-APRS-Rev21-FULL-COMPAT-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified Rev2.1 source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp include/main.h include/config.h lib/LibAPRS_ESP32S3/AFSK.cpp lib/LibAPRS_ESP32S3/AFSK.h platformio.ini boards/LilyGo-T-TWR-Plus.json
          if git diff --cached --quiet; then
            echo "Rev2.1 source patch already committed."
          else
            git commit -m "Apply verified T-TWR Rev2.1 full compatibility fixes"
            git push origin HEAD:rev21-hardware-port
          fi
