name: T-TWR Rev2.1 Firmware

on:
  push:
    branches:
      - rev21-hardware-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply T-TWR Rev2.1 hardware port
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "static void applyTwrRev21HardwareProfile()" src/main.cpp; then
            echo "Rev2.1 hardware port already present in committed source."
          else
            python tools/rev21_port.py
          fi

      - name: Repair AFSK macro continuation
        run: python tools/repair_rev21_afsk_macros.py

      - name: Apply Rev2.1 runtime stability fixes
        run: python tools/rev21_runtime_fixes.py

      - name: Apply Rev2.1 full hardware compatibility pass
        run: python tools/rev21_full_compat.py

      - name: Apply Rev2.1 radio safety normalization
        run: python tools/rev21_radio_safety.py

      - name: Apply ESP32-S3 sleep compatibility fix
        run: python tools/rev21_sleep_compat.py

      - name: Apply Rev2.1 OLED shared-I2C compatibility fix
        run: python tools/rev21_display_i2c_compat.py

      - name: Apply Rev2.1 deep compatibility pass
        run: python tools/rev21_deep_compat.py

      - name: Apply Rev2.1 physical RF validation fixes
        shell: bash
        run: |
          set -euo pipefail
          python tools/rev21_hw_validation_fixes.py
          python tools/rev21_modem_late_extern_fix.py

      - name: Verify Rev2.1 source invariants
        run: python tools/verify_rev21_port.py

      - name: Verify Rev2.1 deep compatibility invariants
        run: python tools/verify_rev21_deep_compat.py

      - name: Verify Rev2.1 RF-validation invariants
        run: python tools/verify_rev21_hw_validation.py

      - name: Verify patch pass is idempotent
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          FILES="src/main.cpp src/config.cpp src/webservice.cpp include/gui_lcd.h src/gui_lcd.cpp src/sensor.cpp platformio.ini lib/LibAPRS_ESP32S3/AFSK.cpp lib/LibAPRS_ESP32S3/AFSK.h lib/LibAPRS_ESP32S3/modem.cpp"
          BEFORE="$(sha256sum $FILES | sha256sum | awk '{print $1}')"
          python tools/rev21_deep_compat.py
          python tools/rev21_hw_validation_fixes.py
          python tools/rev21_modem_late_extern_fix.py
          AFTER="$(sha256sum $FILES | sha256sum | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"
          echo "PASS Rev2.1 deep/RF patch set is idempotent"

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio esptool

      - name: PlatformIO build
        run: pio run -e esp32s3-twrplus

      - name: Package firmware images
        shell: bash
        run: |
          set -euo pipefail
          ENV_DIR=.pio/build/esp32s3-twrplus
          mkdir -p dist
          cp "$ENV_DIR/firmware.bin" dist/TWR_APRS_Rev21_UPDATE.bin
          cp "$ENV_DIR/bootloader.bin" dist/bootloader.bin
          cp "$ENV_DIR/partitions.bin" dist/partitions.bin
          BOOT_APP="$(find "$HOME/.platformio" -type f -name boot_app0.bin | head -n 1 || true)"
          if [ -z "$BOOT_APP" ]; then
            echo "boot_app0.bin not found" >&2
            exit 1
          fi
          cp "$BOOT_APP" dist/boot_app0.bin
          python -m esptool --chip esp32s3 merge-bin -o dist/TWR_APRS_Rev21_FULL_INSTALL.bin 0x0000 dist/bootloader.bin 0x8000 dist/partitions.bin 0xe000 dist/boot_app0.bin 0x10000 dist/TWR_APRS_Rev21_UPDATE.bin

          cat > dist/FLASH_PROFILE_UPDATE_KEEP_SETTINGS.bat <<'EOF'
          @echo off
          setlocal
          set PORT=%~1
          if "%PORT%"=="" set /p PORT=Enter COM port (example COM27): 
          python -m esptool --chip esp32s3 --port %PORT% --baud 921600 write_flash -z 0x0000 bootloader.bin 0x10000 TWR_APRS_Rev21_UPDATE.bin 0x410000 TWR_APRS_Rev21_UPDATE.bin
          if errorlevel 1 exit /b %errorlevel%
          echo.
          echo Rev2.1 board-profile migration complete. Bootloader and both OTA app slots were updated; settings were not erased.
          endlocal
          EOF
          sed -i 's/^          //' dist/FLASH_PROFILE_UPDATE_KEEP_SETTINGS.bat

          cat > dist/FLASH_UPDATE_KEEP_SETTINGS.bat <<'EOF'
          @echo off
          setlocal
          set PORT=%~1
          if "%PORT%"=="" set /p PORT=Enter COM port (example COM27): 
          python -m esptool --chip esp32s3 --port %PORT% --baud 921600 write_flash -z 0x10000 TWR_APRS_Rev21_UPDATE.bin 0x410000 TWR_APRS_Rev21_UPDATE.bin
          if errorlevel 1 exit /b %errorlevel%
          echo.
          echo Rev2.1 firmware update complete in both OTA slots. Wi-Fi/callsign/settings were not erased.
          endlocal
          EOF
          sed -i 's/^          //' dist/FLASH_UPDATE_KEEP_SETTINGS.bat

          cat > dist/FLASH_FULL_CLEAN_INSTALL.bat <<'EOF'
          @echo off
          setlocal
          set PORT=%~1
          if "%PORT%"=="" set /p PORT=Enter COM port (example COM27): 
          python -m esptool --chip esp32s3 --port %PORT% erase_flash
          if errorlevel 1 exit /b %errorlevel%
          python -m esptool --chip esp32s3 --port %PORT% --baud 921600 write_flash -z 0x0000 TWR_APRS_Rev21_FULL_INSTALL.bin
          if errorlevel 1 exit /b %errorlevel%
          echo.
          echo Full clean install complete. Device settings must be configured again.
          endlocal
          EOF
          sed -i 's/^          //' dist/FLASH_FULL_CLEAN_INSTALL.bat

          cat > dist/FLASH_INSTRUCTIONS.txt <<'EOF'
          LILYGO T-TWR Plus Rev2.1 - FULL COMPATIBILITY BUILD
          ===================================================

          FIRST REV2.1 BOARD-PROFILE MIGRATION - PRESERVES SETTINGS
          ---------------------------------------------------------
          Use this once when moving from an older/generic T-TWR build to this
          verified Rev2.1 hardware profile. It updates the second-stage
          bootloader plus BOTH A/B application slots. It does NOT erase or
          rewrite the partition table, OTA metadata, NVS, LittleFS, Wi-Fi,
          callsign or other saved settings.

            bootloader: 0x0000
            app0:       0x10000
            app1:       0x410000
            Do NOT run erase_flash.

            python -m esptool --chip esp32s3 --port COMxx --baud 921600 write_flash -z 0x0000 bootloader.bin 0x10000 TWR_APRS_Rev21_UPDATE.bin 0x410000 TWR_APRS_Rev21_UPDATE.bin

          Windows helper:
            FLASH_PROFILE_UPDATE_KEEP_SETTINGS.bat COM27

          NORMAL SERIAL UPDATE AFTER PROFILE MIGRATION - PRESERVES SETTINGS
          -----------------------------------------------------------------
          Web OTA may make either app0 or app1 the selected boot slot, so the
          serial helper writes the same verified application image to BOTH
          OTA slots. It does not touch bootloader, partition table, OTA metadata,
          NVS or LittleFS.

            app0: 0x10000
            app1: 0x410000
            Do NOT run erase_flash.

            python -m esptool --chip esp32s3 --port COMxx --baud 921600 write_flash -z 0x10000 TWR_APRS_Rev21_UPDATE.bin 0x410000 TWR_APRS_Rev21_UPDATE.bin

          Windows helper:
            FLASH_UPDATE_KEEP_SETTINGS.bat COM27

          WEB OTA
          -------
          After the board-profile migration, TWR_APRS_Rev21_UPDATE.bin is the
          raw application image for the firmware's web OTA updater. Web OTA
          preserves user configuration and lets the bootloader select the OTA
          slot normally.

          CLEAN/FULL INSTALL - ERASES SETTINGS
          ------------------------------------
            File:   TWR_APRS_Rev21_FULL_INSTALL.bin
            Offset: 0x0000

            python -m esptool --chip esp32s3 --port COMxx erase_flash
            python -m esptool --chip esp32s3 --port COMxx --baud 921600 write_flash -z 0x0000 TWR_APRS_Rev21_FULL_INSTALL.bin

          Windows helper:
            FLASH_FULL_CLEAN_INSTALL.bat COM27

          NOTE ON ESP IMAGE HEADERS
          -------------------------
          The pioarduino builder emits DIO ROM-bootstrap image headers while the
          LilyGo-T-TWR-Plus board configuration itself is QIO/OPI. The verified
          board profile is qio_opi with 16MB flash and 80MHz flash clock.
          EOF
          sed -i 's/^          //' dist/FLASH_INSTRUCTIONS.txt

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Source commit: $GITHUB_SHA"
            echo "Environment: esp32s3-twrplus"
            echo "Hardware: LILYGO T-TWR Plus Rev2.1"
            echo "Board profile: official LilyGo-T-TWR-Plus"
            echo "Display controller: SH1106 128x64"
            echo "Configured flash: QIO 80MHz / 16MB"
            echo "PSRAM topology: OPI (qio_opi memory profile)"
            echo "ROM bootstrap image headers: DIO (pioarduino); board profile: QIO/OPI"
            echo "FIRST PROFILE UPDATE: bootloader 0x0000 + app0 0x10000 + app1 0x410000, no erase"
            echo "NORMAL SERIAL UPDATE: app0 0x10000 + app1 0x410000, no erase"
            echo "FULL_INSTALL image offset: 0x0000 after erase"
            echo "RF validation: GPIO42 NeoPixel disabled; TX/RX transition recovery hardened"
            echo
            ls -lh dist/*.bin
          } > dist/BUILD_INFO.txt
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          rm -f dist/TWR_APRS_Rev21_NIGHTLY_2026-09-05.zip
          zip -j dist/TWR_APRS_Rev21_NIGHTLY_2026-09-05.zip \
            dist/TWR_APRS_Rev21_UPDATE.bin \
            dist/TWR_APRS_Rev21_FULL_INSTALL.bin \
            dist/bootloader.bin \
            dist/partitions.bin \
            dist/boot_app0.bin \
            dist/FLASH_PROFILE_UPDATE_KEEP_SETTINGS.bat \
            dist/FLASH_UPDATE_KEEP_SETTINGS.bat \
            dist/FLASH_FULL_CLEAN_INSTALL.bat \
            dist/FLASH_INSTRUCTIONS.txt \
            dist/BUILD_INFO.txt \
            dist/SHA256SUMS.txt
          cat dist/BUILD_INFO.txt
          cat dist/SHA256SUMS.txt

      - name: Verify packaged binary and partition invariants
        run: python tools/verify_rev21_binary.py

      - name: Show ESP image metadata
        shell: bash
        run: |
          python -m esptool --chip esp32s3 image-info dist/bootloader.bin
          python -m esptool --chip esp32s3 image-info dist/TWR_APRS_Rev21_UPDATE.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWR-APRS-Rev21-FULL-COMPAT-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified Rev2.1 source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp src/config.cpp include/gui_lcd.h src/gui_lcd.cpp src/sensor.cpp src/webservice.cpp include/main.h include/config.h include/rev21_sh1106_compat.h lib/LibAPRS_ESP32S3/AFSK.cpp lib/LibAPRS_ESP32S3/AFSK.h lib/LibAPRS_ESP32S3/modem.cpp lib/Adafruit_GFX/library.properties platformio.ini boards/LilyGo-T-TWR-Plus.json
          if git diff --cached --quiet; then
            echo "PASS no generated source changes; committed source is reproducible."
          else
            REMOTE_HEAD="$(git ls-remote origin refs/heads/rev21-hardware-port | awk '{print $1}')"
            if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
              echo "SKIP source auto-commit: branch advanced from $GITHUB_SHA to $REMOTE_HEAD during this run."
              echo "A newer workflow run will verify and commit the current branch state."
              exit 0
            fi
            git commit -m "Apply verified T-TWR Rev2.1 RF compatibility fixes"
            git push origin HEAD:rev21-hardware-port
          fi

      - name: Refresh Nightly GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/rev21-hardware-port'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nightly-rev21-2026-09-05"
          RELEASE_ID="383216847"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/rev21-hardware-port | awk '{print $1}')"
          if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            echo "SKIP release refresh: branch advanced to $REMOTE_HEAD; newer run will publish it."
            exit 0
          fi
          SOURCE_SHA="$LOCAL_HEAD"

          cat > dist/RELEASE_NOTES.md <<EOF
          # LILYGO T-TWR Plus Rev2.1 — Nightly RF Validation Build

          **Verified build commit:** \`${SOURCE_SHA}\`  
          **CI workflow run:** \`${GITHUB_RUN_ID}\`  
          **Target hardware:** LILYGO T-TWR Plus Rev2.1 / ESP32-S3 / SA868S / SH1106 128x64

          > **Nightly status:** Source, compatibility, binary and compile/link verification are green. Physical on-device RF validation is still required before promotion to stable.

          ## RF validation fixes in this refresh
          - GPIO42 NeoPixel/RMT is disabled during RF validation to remove the observed ESP32-S3 RMT allocation failure from the APRS test path.
          - ADC DMA samples are blocked while AFSK TX owns the audio path.
          - RX FIFO is bounded and flushed across TX-to-RX recovery.
          - TX-stop GPIO/ADC work is deferred from the timer ISR to FreeRTOS task context.
          - Event-only PTT41 / MUX17 / DAC18 START/STOP diagnostics were added.
          - Per-second tracker counter serial spam was removed.
          - AFSK transition flags and modem extern declarations are volatile-safe.

          ## Validation gates
          - **74/74** Rev2.1 source/hardware checks: PASS
          - **64/64** deep compatibility checks: PASS
          - **30/30** RF hardware-validation checks: PASS
          - Packaged binary/partition checks: PASS
          - PlatformIO compile/link \`esp32s3-twrplus\`: PASS
          - Firmware packaging and ESP image validation: PASS
          - Patch idempotence: PASS

          ## Rev2.1 hardware profile
          - SA868 UART: TX GPIO39 / RX GPIO48
          - PTT: GPIO41 active LOW; idle HIGH
          - PD: GPIO40 active HIGH
          - SQL: GPIO2 active LOW
          - APRS RX ADC: GPIO1
          - APRS TX audio: GPIO18
          - Audio routing: GPIO17
          - GPIO38 Rev2.0 RF-power selector remains disabled
          - SA868 DMOSETGROUP RF power: HIGH=0 / LOW=1
          - SH1106 shared I2C: SDA GPIO8 / SCL GPIO9 @ 400 kHz

          ## Assets
          - \`TWR_APRS_Rev21_UPDATE.bin\` — normal firmware / Web OTA image
          - \`TWR_APRS_Rev21_FULL_INSTALL.bin\` — full clean-install image
          - \`TWR_APRS_Rev21_NIGHTLY_2026-09-05.zip\` — complete bundle including flash helpers
          - \`SHA256SUMS.txt\` — binary checksums
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$SOURCE_SHA"
          git push --force origin "refs/tags/$TAG"

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f name="Nightly Build — LILYGO T-TWR Plus Rev2.1 — RF Validation — 2026-09-05" \
            -f target_commitish="$SOURCE_SHA" \
            -F body=@dist/RELEASE_NOTES.md >/dev/null

          gh release upload "$TAG" \
            dist/TWR_APRS_Rev21_UPDATE.bin \
            dist/TWR_APRS_Rev21_FULL_INSTALL.bin \
            dist/TWR_APRS_Rev21_NIGHTLY_2026-09-05.zip \
            dist/SHA256SUMS.txt \
            --clobber

          echo "PASS Nightly release refreshed at $SOURCE_SHA"
