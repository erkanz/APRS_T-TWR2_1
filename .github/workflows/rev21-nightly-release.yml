name: Publish T-TWR Rev2.1 Nightly Release

on:
  push:
    branches:
      - rev21-hardware-port
    paths:
      - .github/workflows/rev21-nightly-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish Rev2.1 nightly release'
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release_dist
          gh run download 33990710815 \
            --repo erkanz/APRS_T-TWR2_1 \
            --name TWR-APRS-Rev21-FULL-COMPAT-eed1e73df6dc2bd312deae0565f4d232f55c34e9 \
            --dir release_dist
          ls -lah release_dist

      - name: Verify downloaded nightly payload
        shell: bash
        run: |
          set -euo pipefail
          cd release_dist
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum TWR_APRS_Rev21_UPDATE.bin | awk '{print $1}')" = "c3bbbdf92a551b2191bbcf51c983379dc236cf7f40def68371e8ab5f5c417e9f"
          test "$(sha256sum TWR_APRS_Rev21_FULL_INSTALL.bin | awk '{print $1}')" = "60f52dff859f6ef0fc00f7389fc0abc3762e3438d38e609570d3737a506e81df"

      - name: Create release archive and notes
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="TWR_APRS_Rev21_NIGHTLY_2026-09-05_R2.zip"
          (cd release_dist && zip -9 -r "../$ARCHIVE" .)
          sha256sum "$ARCHIVE"

          cat > RELEASE_NOTES.md <<'EOF'
          # LILYGO T-TWR Plus Rev2.1 — Nightly Build R2

          This Nightly R2 incorporates fixes found during the first on-device Rev2.1 validation session.

          **Verified generated-source input:** `eed1e73df6dc2bd312deae0565f4d232f55c34e9`  
          **Verified committed firmware source:** `e8db9c8`  
          **Verification workflow:** run `33990710815`  
          **Target:** LILYGO T-TWR Plus Rev2.1 / ESP32-S3 / SA868S / SH1106 128x64

          > **Nightly status:** development/test release. Compile, source invariants, binary/partition validation and packaging are green. Hardware validation is still in progress.

          ## R2 fixes from physical testing

          - Removed the once-per-second `TRACKER tx_counter / INTERVAL` serial debug flood.
          - Fixed manual APRS beacon behavior. A short BOOT-button press now builds the tracker position and queues it directly to the RF channel; it no longer depends on periodic tracker timing or `trk_loc2rf`.
          - Added clear manual/TX diagnostics: `[MANUAL BEACON]` and `[APRS TX]`.
          - Removed a circular TX-start wait that could add about one second before AFSK DAC transmission begins.
          - Added explicit DAC GPTimer running-state tracking so idle/RX code does not call `timerStop()` on an already stopped timer (`gptimer_stop: timer is not running`).
          - AX.25/FCS-valid frames whose APRS information field is malformed are no longer hidden from Last Heard. They are shown as `RF: AX.25 OK` / `INVALID APRS`.
          - The APRS parser itself was not loosened: malformed coordinates remain invalid rather than being silently accepted.

          ## Existing Rev2.1 hardware compatibility

          - SA868 UART TX39/RX48, SQL GPIO2 active LOW, PD GPIO40, PTT GPIO41 active LOW.
          - APRS RX ADC GPIO1, TX audio GPIO18, audio routing GPIO17.
          - Rev2.0-only GPIO38 RF selector disabled.
          - Shared system I2C locked to GPIO8/9 @ 400 kHz.
          - Native SH1106 128x64 path with Rev21 compatibility bitmap renderer.
          - Rev2.1 PMU/power-domain normalization and safe radio sleep/recovery ordering.
          - ESP32-S3 sleep/TWDT compatibility fixes.
          - A/B OTA layout retained; serial update writes both app0 and app1.

          ## Verification

          - **74/74** Rev2.1 source/hardware invariants — PASS
          - **64/64** deep compatibility invariants — PASS
          - **31/31** packaged binary/partition invariants — PASS
          - PlatformIO compile + link — PASS
          - Firmware packaging — PASS
          - Patch idempotence — PASS

          Build footprint:
          - RAM: 75,668 / 327,680 bytes — 23.1%
          - Flash: 2,154,538 / 4,194,304 bytes — 51.4%
          - Application image: 2,155,360 bytes

          Main hashes:
          - `TWR_APRS_Rev21_UPDATE.bin` — `c3bbbdf92a551b2191bbcf51c983379dc236cf7f40def68371e8ab5f5c417e9f`
          - `TWR_APRS_Rev21_FULL_INSTALL.bin` — `60f52dff859f6ef0fc00f7389fc0abc3762e3438d38e609570d3737a506e81df`

          ## Flashing for an existing Rev2.1 Nightly installation

          Preserve settings:
          ```bat
          FLASH_UPDATE_KEEP_SETTINGS.bat COM27
          ```

          This writes the same verified application to both OTA slots (`0x10000` and `0x410000`) without erasing NVS or LittleFS.

          Web OTA can use:
          `TWR_APRS_Rev21_UPDATE.bin`

          Full clean install (erases settings):
          ```bat
          FLASH_FULL_CLEAN_INSTALL.bat COM27
          ```

          ## Manual beacon test

          After boot, briefly press and release BOOT. Expected serial markers:
          ```text
          [MANUAL BEACON] BOOT short press
          [MANUAL BEACON] queued RF: ...
          [APRS TX] RF queue len=...: ...
          ```
          There should no longer be a continuous `TRACKER tx_counter=... INTERVAL=...` line every second, and no repeated `gptimer_stop: timer is not running` errors during normal RX/idle operation.
          EOF
          sed -i 's/^          //' RELEASE_NOTES.md

      - name: Publish GitHub Nightly R2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nightly-rev21-2026-09-05-r2"
          gh release create "$TAG" \
            --repo erkanz/APRS_T-TWR2_1 \
            --target e8db9c8 \
            --title "Nightly Build R2 — LILYGO T-TWR Plus Rev2.1 — 2026-09-05" \
            --notes-file RELEASE_NOTES.md \
            --latest \
            TWR_APRS_Rev21_NIGHTLY_2026-09-05_R2.zip \
            release_dist/TWR_APRS_Rev21_UPDATE.bin \
            release_dist/TWR_APRS_Rev21_FULL_INSTALL.bin \
            release_dist/SHA256SUMS.txt
